# Synthetic telemetry demo: start each emulator with --vary.
endpoint: opc.tcp://127.0.0.1:4840/dune/
timeout: 2
concurrency: 32
devices:
  - id: wib-001
    kind: wib
    endpoint: tcp://127.0.0.1:1234
    variables:
      TemperatureC: {source: sensors.ad7414_49_temp, type: Double, unit: degC}
      Femb0On: {source: femb.femb_power.0, type: Boolean}
  - id: daphne-001
    kind: daphne
    endpoint: tcp://127.0.0.1:40001
    variables:
      Threshold: {source: counters.snapshots.0.threshold, type: UInt32}
      TestRegister: {source: test_register.value, type: UInt32}
      Bias0V: {source: info.v_bias_0, type: Double, unit: V}
      Bias1V: {source: info.v_bias_1, type: Double, unit: V}
      Bias2V: {source: info.v_bias_2, type: Double, unit: V}
      Bias3V: {source: info.v_bias_3, type: Double, unit: V}
      Bias4V: {source: info.v_bias_4, type: Double, unit: V}
      PowerMinus5V: {source: info.power_minus5v, type: Double, unit: V}
      # Protocol field power_plus2p5v is populated from 3V3PDS by the current server.
      Power3V3PdsV: {source: info.power_plus2p5v, type: Double, unit: V}
      PowerCeV: {source: info.power_ce, type: Double, unit: V}
      TemperatureC: {source: info.temperature, type: Double, unit: degC}
      RecordCount: {source: counters.snapshots.0.record_count, type: UInt64}
      BusyCount: {source: counters.snapshots.0.busy_count, type: UInt64}
      FullCount: {source: counters.snapshots.0.full_count, type: UInt64}
  - id: pdu-001
    kind: pdu
    endpoint: udp://127.0.0.1:1161
    community: private
    variables:
      Outlet1On:
        source: 1.3.6.1.4.1.13742.6.4.1.2.1.3.1.1
        type: Boolean
        values: {7: true, 8: false}
      OutletCount: {source: 1.3.6.1.4.1.13742.6.3.2.2.1.4.1, type: UInt32}
      Outlet1CurrentmA: {source: 1.3.6.1.4.1.13742.6.5.4.3.1.4.1.1.1, type: UInt32, unit: mA}
      Outlet1VoltagemV: {source: 1.3.6.1.4.1.13742.6.5.4.3.1.4.1.1.4, type: UInt32, unit: mV}
