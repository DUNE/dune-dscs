[project]
name = "dune-dscs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "asyncua>=1.1.8",
    "opcua>=0.98.13",
    "protobuf>=7.36.1",
    "pysnmp>=7.1.30,<8",
    "python-ipmi>=0.6.1,<0.7",
    "pyyaml>=6.0.3",
    "pyzmq>=27.2.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17.1",
]
