name: PyLint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyLint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run PyLint
        run: |
          pylint $(git ls-files '*.py')