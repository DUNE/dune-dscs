# WIB sensor field definitions used by wib_ignition_bridge.py.
#
# Each entry is: <protobuf field name>: <array length>
#
# The name must match a field name in the WIB protobuf messages (wib_pb2 -
# GetSensors.Sensors, GetSWVersion.Version, GetTimestamp.Timestamp,
# GetTimingStatus.TimingStatus, Peek) exactly, since update_node() reads it
# via getattr(response, name). The length is how many OPC UA variables get
# created for that field (1 for a scalar field, N for a repeated/array field).
#
# To add a new WIB sensor: add a line under the matching section below and
# restart the bridge. No Python changes are needed. This is separate from
# wibs.yaml (the per-WIB host/port list), which several other scripts also
# depend on.

voltages:
  vol1: 2


temperatures:
  Temp1: 1

