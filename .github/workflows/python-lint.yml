name: Lint

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python environment
        run: |
          uv sync

      - name: Run ruff
        run: |
          uv run ruff check